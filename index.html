<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>일급 자동 계산 프로그램 사전 설문</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #f3f5f4; --card: #ffffff; --ink: #17211f; --muted: #5d6b68;
    --line: #dde3e1; --accent: #0f766e; --accent-soft: #e3f2ef; --warn: #b42318;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 "Pretendard Variable", Pretendard, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    word-break: keep-all;
  }
  main { max-width: 680px; margin: 0 auto; padding: 32px 16px 96px; }
  .eyebrow { margin: 0; color: var(--accent); font-weight: 700; font-size: 14px; letter-spacing: .04em; }
  h1 { margin: 4px 0 12px; font-size: 26px; line-height: 1.3; }
  #intro { margin: 0; color: var(--muted); white-space: pre-line; }
  .progress { height: 6px; margin: 28px 0 8px; background: var(--line); border-radius: 3px; overflow: hidden; }
  #bar { height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  #stepLabel { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  h2 { margin: 0 0 16px; font-size: 20px; }
  .q { margin: 0 0 16px; padding: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
  legend { float: left; width: 100%; padding: 0; font-weight: 700; font-size: 17px; line-height: 1.45; }
  .req { color: var(--warn); font-size: 13px; font-weight: 600; }
  .ex { clear: both; margin: 0; padding: 6px 0 14px; color: var(--muted); font-size: 14px; }
  .opt { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
  .opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .opt input[type=radio], .opt input[type=checkbox] { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); flex: none; }
  .opt span { flex: 1; min-width: 0; }
  input[type=text], textarea {
    width: 100%; padding: 12px 14px; font: inherit; color: inherit; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px;
  }
  .other { flex-basis: 100%; }
  textarea { resize: vertical; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .err { margin: 10px 0 0; color: var(--warn); font-size: 14px; font-weight: 600; }
  .nav { display: flex; gap: 12px; margin-top: 24px; }
  button { padding: 14px 22px; font: inherit; font-weight: 700; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  #next, #copy { flex: 1; background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .6; cursor: default; }
  #done { padding: 32px 20px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  #done h2 { font-size: 22px; }
  #done textarea { margin: 16px 0 12px; font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">사전 설문</p>
    <h1 id="title"></h1>
    <p id="intro"></p>
  </header>
  <div id="survey">
    <div class="progress"><div id="bar"></div></div>
    <p id="stepLabel"></p>
    <form id="form" novalidate></form>
    <div class="nav">
      <button type="button" id="prev">이전</button>
      <button type="button" id="next">다음</button>
    </div>
  </div>
  <section id="done" hidden>
    <h2 id="doneTitle">응답해 주셔서 감사합니다.</h2>
    <p id="doneText">답변이 잘 전달되었습니다. 이 창은 닫으셔도 됩니다.</p>
    <div id="fallback" hidden>
      <textarea id="dump" rows="12" readonly></textarea>
      <button type="button" id="copy">답변 복사하기</button>
    </div>
  </section>
</main>

      { t: 'check',
        q: '아래 자료 중 보내 주실 수 있는 것을 골라 주세요.',
        ex: '프로그램 계산이 맞는지 확인하는 데 씁니다. 이름이나 주민번호 같은 개인정보는 지우고 주셔도 됩니다. 파일은 이 설문과 별도로 전달해 주세요.',
        opts: ['지금 계산에 쓰는 엑셀이나 장부 양식', '실제 출퇴근 기록 며칠치', '그 기록으로 직접 계산하신 일급 결과', '결과 양식 (일급 대장 등)'] },
      { t: 'text',
        q: '그 밖에 꼭 들어갔으면 하는 기능이나 하고 싶은 말씀이 있으면 적어 주세요.',
        ex: '공휴일은 자동으로 표시되면 좋겠습니다.' },
    ],
  },
];
// 응답을 받을 주소. 비어 있으면 전송 대신 답변을 복사하는 화면이 나온다.
const ENDPOINT = 'https://formsubmit.co/ajax/bii38390beom@gmail.com';

const $ = id => document.getElementById(id);
const el = (tag, props, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
const form = $('form');
$('title').textContent = TITLE;
$('intro').textContent = INTRO;

let n = 0, step = 0;
const pages = SECTIONS.map(s => {
  const page = el('section', { hidden: true }, el('h2', { textContent: s.title }));
  s.items.forEach(it => {
    it.name = 'q' + (++n);
    it.label = n + '. ' + it.q;
    it.err = el('p', { className: 'err', textContent: '이 질문은 꼭 답해 주세요.', hidden: true });
    const field = el('fieldset', { className: 'q' },
      el('legend', {}, it.q, it.req ? el('span', { className: 'req', textContent: ' 필수' }) : ''),
      el('p', { className: 'ex', textContent: '예) ' + it.ex }));
    if (it.opts) {
      const type = it.t === 'choice' ? 'radio' : 'checkbox';
      it.opts.forEach(o => field.append(el('label', { className: 'opt' },
        el('input', { type, name: it.name, value: o }), el('span', { textContent: o }))));
      if (it.other) {
        const box = el('input', { type, name: it.name, value: '기타' });
        const text = el('input', { type: 'text', name: it.name + '_other', className: 'other', placeholder: '직접 적어 주세요' });
        text.addEventListener('input', () => { box.checked = true; });
        field.append(el('label', { className: 'opt' }, box, el('span', { textContent: '기타' }), text));
      }
    } else {
      field.append(it.t === 'short' ? el('input', { type: 'text', name: it.name }) : el('textarea', { name: it.name, rows: 3 }));
    }
    field.append(it.err);
    it.field = field;
    page.append(field);
  });
  form.append(page);
  return page;
});

function answer(it) {
  const fd = new FormData(form);
  if (!it.opts) return (fd.get(it.name) || '').trim();
  return fd.getAll(it.name)
    .map(v => v === '기타' ? '기타: ' + (fd.get(it.name + '_other') || '').trim() : v)
    .join(', ');
}

function show(i) {
  step = i;
  pages.forEach((p, k) => { p.hidden = k !== i; });
  $('bar').style.width = ((i + 1) / pages.length * 100) + '%';
  $('stepLabel').textContent = (i + 1) + ' / ' + pages.length + ' 단계';
  $('prev').hidden = i === 0;
  $('next').textContent = i === pages.length - 1 ? '제출하기' : '다음';
  window.scrollTo(0, 0);
}

function validate() {
  let first = null;
  SECTIONS[step].items.forEach(it => {
    const missing = !!it.req && !answer(it);
    it.err.hidden = !missing;
    if (missing && !first) first = it.field;
  });
  if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
  return !first;
}

async function submit() {
  const data = {};
  SECTIONS.forEach(s => s.items.forEach(it => { data[it.label] = answer(it) || '(답 없음)'; }));
  $('next').disabled = true;
  $('next').textContent = '보내는 중...';
  let ok = false;
  try {
    const r = await fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify(Object.assign({ _subject: TITLE + ' 응답', _template: 'table', _captcha: 'false' }, data)),
    });
    ok = !!ENDPOINT && r.ok && String((await r.json()).success) !== 'false';
  } catch (e) {}
  $('survey').hidden = true;
  $('done').hidden = false;
  if (!ok) {
    // 전송이 실패해도 답변을 잃지 않도록 복사할 수 있게 보여 준다.
    $('doneTitle').textContent = '답변을 자동으로 보내지 못했습니다.';
    $('doneText').textContent = '아래 내용을 복사해서 담당자에게 문자나 메신저로 보내 주세요.';
    $('dump').value = Object.keys(data).map(k => k + '\n' + data[k]).join('\n\n');
    $('fallback').hidden = false;
  }
  window.scrollTo(0, 0);
}

$('prev').onclick = () => show(step - 1);
$('next').onclick = () => { if (validate()) step < pages.length - 1 ? show(step + 1) : submit(); };
$('copy').onclick = () => {
  navigator.clipboard.writeText($('dump').value)
    .then(() => { $('copy').textContent = '복사했습니다'; })
    .catch(() => { $('dump').select(); });
};
show(0);
</script>
</body>
</html>
